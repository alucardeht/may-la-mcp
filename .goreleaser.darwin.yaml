version: 2

builds:
  - id: mayla-darwin
    main: ./cmd/mayla
    binary: mayla
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/alucardeht/may-la-mcp/pkg/version.Version={{ .Version }}
      - -X github.com/alucardeht/may-la-mcp/pkg/version.Commit={{ .Commit }}
      - -X github.com/alucardeht/may-la-mcp/pkg/version.BuildDate={{ .Date }}

archives:
  - id: darwin
    builds:
      - mayla-darwin
    format: binary
    name_template: "{{ .Binary }}-{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums_darwin.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  mode: append
